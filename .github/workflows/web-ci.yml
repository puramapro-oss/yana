name: Web CI

# Vérifie le site Next.js (yana.purama.dev) sur PR + push main.
# Ne touche PAS mobile/ — l'autre workflow s'en charge.

on:
  pull_request:
    paths-ignore:
      - "mobile/**"
      - "GOOGLE_PLAY_SETUP.md"
      - "README.md"
      - "**.md"
  push:
    branches:
      - main
    paths-ignore:
      - "mobile/**"
      - "GOOGLE_PLAY_SETUP.md"

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tsc-and-build:
    name: TypeScript + Next build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: yana
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: yana
          persist-credentials: false

      - name: Setup Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: yana/package-lock.json

      - name: Verify private source admission and cleanup regressions without credentials
        run: node --test scripts/bootstrap-shared-packages.test.mjs scripts/install-private-dependencies.test.mjs scripts/verify-smarana-source.test.mjs

      - name: Read immutable private source revisions
        id: shared
        run: |
          node scripts/bootstrap-shared-packages.mjs --github-output
          node scripts/verify-smarana-source.mjs --github-output

      - name: Check required private read credentials
        env:
          PACKAGE_SOURCE_KEY_PRESENT: ${{ secrets.PURAMA_PACKAGES_READ_SSH_KEY != '' }}
          SMARANA_KEY_PRESENT: ${{ secrets.SMARANA_READ_SSH_KEY != '' }}
        run: |
          if [ "$PACKAGE_SOURCE_KEY_PRESENT" != true ]; then
            echo '::error::A dedicated read-only PURAMA_PACKAGES_READ_SSH_KEY is required for purama-master.'
            exit 1
          fi
          if [ "$SMARANA_KEY_PRESENT" != true ]; then
            echo '::error::A separate read-only SMARANA_READ_SSH_KEY is required for purama-smarana.'
            exit 1
          fi

      - name: Retrieve only the two manifest-listed ESLint source files
        env:
          PURAMA_PACKAGES_READ_SSH_KEY: ${{ secrets.PURAMA_PACKAGES_READ_SSH_KEY }}
          TMPDIR: ${{ runner.temp }}/yana-shared-source-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir -m 700 -- "$TMPDIR"
          node scripts/install-private-dependencies.mjs --shared-source "$GITHUB_WORKSPACE/shared-source"

      - name: Remove temporary source authentication
        if: always()
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = fs.realpathSync(process.env.RUNNER_TEMP);
          if (!/^\d+$/.test(process.env.GITHUB_RUN_ID) || !/^\d+$/.test(process.env.GITHUB_RUN_ATTEMPT)) throw new Error('Invalid cleanup identity.');
          const owned = path.join(root, `yana-shared-source-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}`);
          fs.rmSync(owned, { recursive: true, force: true });
          try { fs.lstatSync(owned); throw new Error('Temporary source authentication remains.'); }
          catch (error) { if (error.code !== 'ENOENT') throw error; }
          console.log(JSON.stringify({ sharedSourceTemporaryDirectoryAbsent: true }));
          NODE

      - name: Verify ESLint source digests and create its sibling layout
        run: node scripts/bootstrap-shared-packages.mjs "$GITHUB_WORKSPACE/shared-source" "$GITHUB_WORKSPACE/packages"

      - name: Retrieve only the manifest-listed SMARANA source blobs
        env:
          SMARANA_READ_SSH_KEY: ${{ secrets.SMARANA_READ_SSH_KEY }}
          TMPDIR: ${{ runner.temp }}/yana-smarana-source-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir -m 700 -- "$TMPDIR"
          node scripts/install-private-dependencies.mjs --smarana-source "$GITHUB_WORKSPACE/packages/smarana"

      - name: Remove SMARANA temporary authentication and verify absence before npm
        if: always()
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = fs.realpathSync(process.env.RUNNER_TEMP);
          if (!/^\d+$/.test(process.env.GITHUB_RUN_ID) || !/^\d+$/.test(process.env.GITHUB_RUN_ATTEMPT)) throw new Error('Invalid cleanup identity.');
          for (const prefix of ['yana-shared-source', 'yana-smarana-source']) {
            const owned = path.join(root, `${prefix}-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}`);
            fs.rmSync(owned, { recursive: true, force: true });
            try { fs.lstatSync(owned); throw new Error('Temporary private source authentication remains.'); }
            catch (error) { if (error.code !== 'ENOENT') throw error; }
          }
          console.log(JSON.stringify({ privateSourceTemporaryDirectoriesAbsent: true }));
          NODE

      - name: Verify no checkout authentication remains before dependency scripts
        if: always()
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { spawnSync } = require('node:child_process');
          const env = { ...process.env };
          for (const key of Object.keys(env)) if (key.startsWith('GIT_')) delete env[key];
          Object.assign(env, { GIT_CONFIG_NOSYSTEM: '1', GIT_CONFIG_GLOBAL: '/dev/null' });
          for (const name of ['yana', 'packages/smarana']) {
            const directory = path.join(process.env.GITHUB_WORKSPACE, name);
            if (!fs.existsSync(path.join(directory, '.git'))) continue;
            const checked = spawnSync('git', ['-C', directory, 'config', '--local', '--no-includes', '--name-only', '--get-regexp',
              '^(core\\.sshcommand|http\\..*\\.extraheader|credential\\..*|url\\..*\\.insteadof|include\\.path|includeif\\..*\\.path)$'],
              { env, encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'], timeout: 5000, maxBuffer: 65536 });
            if (checked.error || checked.status !== 1 || checked.stdout.trim()) throw new Error('Persistent checkout authentication remains or cannot be verified.');
          }
          console.log(JSON.stringify({ checkoutAuthenticationConfigAbsent: true }));
          NODE

      - name: Verify every SMARANA source blob before installation
        run: node scripts/verify-smarana-source.mjs "$GITHUB_WORKSPACE/packages/smarana"

      - name: Install
        run: |
          npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
          npm --prefix ../packages/smarana ci --ignore-scripts --no-audit --no-fund
          git diff --exit-code -- package.json package-lock.json tooling/shared-packages.lock.json tooling/smarana-source.lock.json

      - name: Run dependency lifecycle scripts without private credentials
        run: |
          npm rebuild --no-audit --no-fund
          npm --prefix ../packages/smarana rebuild --no-audit --no-fund

      - name: Lint the corrected imports
        run: >-
          node node_modules/eslint/bin/eslint.js --max-warnings 0
          'src/app/(dashboard)/carpool/new/page.tsx'
          'src/app/(dashboard)/settings/abonnement/page.tsx' src/types/autres.ts

      - name: TypeScript strict
        run: node node_modules/typescript/bin/tsc --noEmit --incremental false

      - name: Next build
        run: npm run build
        env:
          # Variables minimales pour build statique. Pas de secret prod ici.
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_SUPABASE_URL: https://example.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy_for_build_only
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:4100
